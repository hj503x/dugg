<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dugg — ask it straight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF8F3;
    --ink: #171A1D;
    --muted: #6E6A61;
    --line: #DEDACD;
    --confirmed: #2F5233;
    --confirmed-bg: #EEF2EA;
    --unresolved: #A8571C;
    --unresolved-bg: #FBF0E6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 24px 40px;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-size: 3.4rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .wordmark span { color: var(--confirmed); }

  .tagline {
    color: var(--muted);
    font-size: 1.02rem;
    margin: 10px 0 48px;
    max-width: 34ch;
    text-align: center;
    line-height: 1.5;
  }

  form {
    width: 100%;
    max-width: 560px;
  }

  .search-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
  }

  input[type="text"] {
    flex: 1;
    border: none;
    background: none;
    outline: none;
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    color: var(--ink);
    padding: 4px 0;
  }

  input[type="text"]::placeholder { color: #B7B2A4; }

  button {
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 2px;
  }

  button:hover { opacity: 0.85; }

  .hint {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 14px;
    line-height: 1.6;
  }

  .hint code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    background: #F0EDE3;
    padding: 1px 5px;
    border-radius: 2px;
  }

  .result {
    width: 100%;
    max-width: 560px;
    margin-top: 40px;
    padding: 22px 24px;
    border-left: 3px solid var(--line);
    display: none;
  }

  .result.confirmed { border-left-color: var(--confirmed); background: var(--confirmed-bg); }
  .result.unresolved { border-left-color: var(--unresolved); background: var(--unresolved-bg); }

  .result-text {
    font-family: 'Fraunces', serif;
    font-size: 1.35rem;
    line-height: 1.45;
    margin: 0 0 14px;
  }

  .result-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }

  footer {
    margin-top: auto;
    padding-top: 60px;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>

  <h1 class="wordmark">dugg<span>.</span></h1>
  <p class="tagline">One answer, stated plainly — or an honest "I don't know" instead of ten pages of guesses.</p>

  <form id="search-form">
    <div class="search-row">
      <input type="text" id="query" placeholder="capital of india" autocomplete="off" autofocus>
      <button type="submit">Ask</button>
    </div>
    <p class="hint">
      Factual mode, no live web yet. Try <code>population of japan</code>,
      <code>15% of 200</code>, or <code>10 km to miles</code>.
    </p>
  </form>

  <div class="result" id="result">
    <p class="result-text" id="result-text"></p>
    <div class="result-meta">
      <span id="result-confidence"></span>
      <span id="result-source"></span>
      <span id="result-type"></span>
    </div>
  </div>

  <footer>Dugg — answer-first search, built to be precise before it's exhaustive.</footer>

<script>
  const API_BASE = window.DUGG_API_BASE || "http://localhost:8000";
  const form = document.getElementById("search-form");
  const input = document.getElementById("query");
  const result = document.getElementById("result");
  const resultText = document.getElementById("result-text");
  const resultConfidence = document.getElementById("result-confidence");
  const resultSource = document.getElementById("result-source");
  const resultType = document.getElementById("result-type");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;

    resultText.textContent = "Thinking…";
    result.className = "result";
    result.style.display = "block";

    try {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();

      resultText.textContent = data.answer;
      resultConfidence.textContent = `confidence: ${(data.confidence * 100).toFixed(0)}%`;
      resultSource.textContent = `source: ${data.source}`;
      resultType.textContent = `type: ${data.query_type}`;
      result.className = "result " + (data.confidence >= 0.5 ? "confirmed" : "unresolved");
    } catch (err) {
      resultText.textContent = "Couldn't reach the Dugg backend. Is it running on " + API_BASE + "?";
      result.className = "result unresolved";
    }
  });
</script>

</body>
</html>
